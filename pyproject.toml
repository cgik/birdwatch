[project]
name = "birdwatch"
version = "0.1.0"
description = "A project that detects if what you choose leaves a spot you choose, in this case a bird."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "cgik", email = "103071318+cgik@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy==2.2.*",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
birdwatch = "birdwatch:__main__:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["vendor/picamera2"] # for dev on mac if you want, git clone https://github.com/raspberrypi/picamera2 vendor/picamera2

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
experiments = [
    "ultralytics>=8.4.123",
]
